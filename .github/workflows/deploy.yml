name: Build and Deploy Quartz Site

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Quartz repo
        uses: actions/checkout@v4

      - name: Checkout Content repo
        uses: actions/checkout@v4
        with:
          repository: 'semsig13-tech/TDOC'
          path: 'content'
          token: ${{ secrets.ACCESS_TOKEN }}

      # Отладочный шаг: выводим список файлов в content
      - name: List content directory
        run: |
          echo "Contents of ./content:"
          ls -la ./content
          echo "Number of .md files:"
          find ./content -name "*.md" | wc -l

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install Dependencies & Build
        run: |
          npm install
          npx quartz build --directory ./content

      # Отладочный шаг: проверяем, создалась ли папка public и есть ли index.html
      - name: Check public directory
        run: |
          if [ -d "./public" ]; then
            echo "public directory exists"
            ls -la ./public
            if [ -f "./public/index.html" ]; then
              echo "index.html found!"
            else
              echo "index.html NOT found!"
            fi
          else
            echo "public directory does NOT exist!"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
