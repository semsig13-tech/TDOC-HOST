name: Build and Deploy Quartz Site

on:
  push:
    branches:
      - v5               # Запуск при пуше в ветку v5 (ваша основная ветка)
  workflow_dispatch:      # Возможность запуска вручную через интерфейс GitHub

# Разрешения для деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий с Quartz (движок)
      - name: Checkout Quartz repo
        uses: actions/checkout@v4

      # 2. Клонируем репозиторий с заметками (контент)
      - name: Checkout Content repo
        uses: actions/checkout@v4
        with:
          repository: 'semsig13-tech/TDOC'   # Ваш репозиторий с заметками
          path: 'content'                   # Папка, куда будут склонированы заметки
          token: ${{ secrets.ACCESS_TOKEN }} # Токен для доступа к приватному репо

      # 3. Устанавливаем Node.js версии 22 (требуется для Quartz 5.0.0)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'    # Кешируем зависимости для ускорения сборки

      # 4. Обновляем npm до последней версии (рекомендуется)
      - name: Update npm
        run: npm install -g npm@latest

      # 5. Устанавливаем зависимости и собираем сайт
      - name: Install Dependencies & Build
        run: |
          npm install
          npx quartz build --directory ./content
          touch ./public/.nojekyll
      # 6. Загружаем собранные файлы как артефакт для деплоя
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 7. Деплой на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
